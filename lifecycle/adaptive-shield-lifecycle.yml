source: >-
  Live probes of every Adaptive Shield host plus integrator documentation that consumed the API
  (Axonius, Brinqa) — Adaptive Shield's own developer portal and help centre are both gone, so no
  first-party versioning or deprecation page survives to cite.
summary: >-
  Adaptive Shield was acquired by CrowdStrike and rebranded to Falcon Shield. The standalone
  Adaptive Shield REST API v1 is in end-of-life: its API reference host is decommissioned, its help
  centre is closed, and integrators publish a dated deprecation of the endpoints. The API hosts
  themselves are still up and still answer, but only to authenticated callers.
versioning:
  scheme: path
  pattern: /api/v1/...
  current: v1
  policy_url: null
  note: >-
    Only v1 was ever published. No first-party versioning policy page is reachable; the developer
    portal that would have carried it no longer resolves in DNS.
deprecation:
  status: deprecated
  date: '2026-01-11'
  scope: The Adaptive Shield REST API v1 endpoints, for organizations on legacy Adaptive Shield credentials.
  statement: >-
    "The Adaptive Shield API endpoints were deprecated on January 11, 2026."
  statement_source: https://docs.axonius.com/docs/adaptive-shield
  provider_published: false
  note: >-
    NOT a first-party statement. It is published by Axonius, an integrator that consumed the API, and
    is the most specific dated deprecation available because Adaptive Shield's own reference is
    offline. Brinqa carries the same direction without a date — "This version of the Adaptive Shield
    connector is deprecated ... Please use the CrowdStrike SaaS Security connector for the full range
    of features."
  sunset_header: unknown
  deprecation_header: unknown
