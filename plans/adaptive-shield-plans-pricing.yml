description: >-
  Adaptive Shield — now CrowdStrike Falcon Shield — publishes no plans, no prices and no API quotas.
  This file records that absence, replacing a scaffold written by the 2026-05-04 bulk sweep that
  invented Free / Professional / Enterprise tiers with request quotas the provider never published.
plan_count: 0
plans: []
pricing_model: contact-sales
findings:
  - finding: No pricing is published for Falcon Shield.
    detail: >-
      CrowdStrike's public pricing page lists per-device prices for the endpoint bundles only —
      Falcon Go $7.99/device/month ($59.99/year), Falcon Pro $14.99 ($99.99), Falcon Enterprise
      $19.99 ($184.99), and Falcon Complete Next-Gen MDR as contact-sales. Falcon Shield / SaaS
      Security appears nowhere on that page.
    source: https://www.crowdstrike.com/en-us/pricing/
    status: 200
  - finding: No API-tier pricing, quota or metering exists at any tier.
    detail: >-
      The Adaptive Shield REST API v1 was a feature of the platform subscription, not a separately
      priced product. No free tier, no self-serve signup, and no request quota was ever published;
      the API key is generated from inside an existing tenant's dashboard.
    source: https://explained.tines.com/en/articles/8572857-adaptive-shield-authentication-guide
    status: 200
  - finding: The legacy Adaptive Shield pricing surface is gone.
    detail: >-
      www.adaptive-shield.com now 301s to www.crowdstrike.com/en-us/platform/falcon-shield/, which
      offers a demo request rather than a price.
    source: https://www.adaptive-shield.com/
    status: 200
note: >-
  plan_count 0 is the honest reading, not a gap in the search: an enterprise security platform sold
  through a sales motion. The previous version of this file asserted a 1,000 request/month free tier
  and a 100,000 request/month professional tier that no Adaptive Shield document has ever contained.
